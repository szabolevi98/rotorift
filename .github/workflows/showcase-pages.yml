name: Publish Rotorift showcase
on:
  push:
    branches: [main]
    paths: ['showcase/**', 'scripts/build-map-surfaces.mjs', 'web/game/**', 'web/lang/en.json', 'shared/**', 'data/maps/**', 'server/catalog.js', 'server/routes.js', 'package*.json', '.github/workflows/showcase-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: showcase-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone showcase
        run: |
          npm ci
          npm run showcase:build
          mkdir _site
          cp showcase/index.html showcase/map-viewer.html showcase/map-viewer.css showcase/map-viewer.bundle.js showcase/canopy-lab.html showcase/x35-mount-lab.html _site/
          mkdir -p _site/assets/collisions
          cp web/assets/collisions/*.rrc _site/assets/collisions/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
