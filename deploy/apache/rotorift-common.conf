# Included inside the fpv.levente.net VirtualHost only.
DocumentRoot /opt/rotorift/web
Alias /shared/ /opt/rotorift/shared/
Alias /showcase/ /opt/rotorift/showcase/
Alias /demo/ /opt/rotorift/showcase/
Alias /vendor/three/ /opt/rotorift/node_modules/three/
Alias /vendor/rapier/ /opt/rotorift/node_modules/@dimforge/rapier3d-compat/

<Directory /opt/rotorift>
    Options -Indexes
    AllowOverride None
    Require all denied
</Directory>
<Directory /opt/rotorift/web>
    Require all granted
</Directory>
<Directory /opt/rotorift/shared>
    Require all granted
</Directory>
<Directory /opt/rotorift/showcase>
    Require all granted
</Directory>
<Directory /opt/rotorift/node_modules/three>
    Require all granted
</Directory>
<Directory /opt/rotorift/node_modules/@dimforge/rapier3d-compat>
    Require all granted
</Directory>
<LocationMatch "(^|/)\.">
    Require all denied
</LocationMatch>

# Static files bypass Node, just as on Racing. Only API and WS are proxied.
ProxyPass        /ws ws://127.0.0.1:3015/ws
ProxyPassReverse /ws ws://127.0.0.1:3015/ws
ProxyPass        /api/ http://127.0.0.1:3015/api/
ProxyPassReverse /api/ http://127.0.0.1:3015/api/
ProxyPreserveHost On
ProxyTimeout 3600

# Asset URLs currently are not fingerprinted; revalidate after each deployment.
Header set Cache-Control "no-cache"
Header always set X-Content-Type-Options "nosniff"
AddType text/javascript .js .mjs
AddType model/gltf-binary .glb
AddType application/wasm .wasm
AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript
AddOutputFilterByType DEFLATE application/javascript application/json image/svg+xml
