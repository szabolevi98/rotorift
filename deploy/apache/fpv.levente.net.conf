<VirtualHost *:80>
    ServerName fpv.levente.net
    DocumentRoot /var/www/rotorift-acme
    <Directory /var/www/rotorift-acme>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://fpv.levente.net%{REQUEST_URI} [R=301,L]
</VirtualHost>
