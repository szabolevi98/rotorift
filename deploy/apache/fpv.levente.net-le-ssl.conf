<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName fpv.levente.net
    ErrorLog ${APACHE_LOG_DIR}/rotorift-error.log
    CustomLog ${APACHE_LOG_DIR}/rotorift-access.log combined
    Include /opt/rotorift/deploy/apache/rotorift-common.conf
    SSLCertificateFile /etc/letsencrypt/live/fpv.levente.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/fpv.levente.net/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
